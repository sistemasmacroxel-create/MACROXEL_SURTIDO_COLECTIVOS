      /* Nunca comprimir una tarjeta/módulo completo: solo el nodo que realmente contiene el nombre. */
      if(el.children.length>0 && el.tagName!=='TD' && el.tagName!=='OPTION')return false;
      return true;
    }
    if(el.tagName==='TD' && el.children.length===0){
      const t=candidateText(el);return words(t).length>36 && /(?:MG|ML|TABLETA|CAPSULA|SOLUCION|SOLUCIÓN|ENVASE|FRASCO|AMPOLLETA|JARABE|POLVO|CREMA|GEL|BOLSA|CAJA)/i.test(t);
    }
    if(el.tagName==='OPTION'){
      const t=candidateText(el);return words(t).length>MAX_WORDS && /(?:MG|ML|TABLETA|CAPSULA|SOLUCION|SOLUCIÓN|ENVASE|FRASCO|AMPOLLETA|JARABE|POLVO|CREMA|GEL|BOLSA|CAJA)/i.test(t);
    }
    return false;
  }
  function removeOldToggle(el){const n=el?.nextElementSibling;if(n?.classList?.contains('mx-longtext-toggle'))n.remove()}
  function collapse(el){
    const full=el.dataset.mxLongFull||candidateText(el);if(!full)return;
    el.dataset.mxLongFull=full;el.dataset.mxLongState='collapsed';el.classList.remove('mx-longtext-expanded');el.classList.add('mx-longtext-collapsed');
    if(plainLeaf(el))el.textContent=preview(full);else el.classList.add('mx-longtext-static-clamp');
    const t=el.nextElementSibling;if(t?.classList?.contains('mx-longtext-toggle'))t.textContent='Ver más';
  }
  function expand(el){
    const full=el.dataset.mxLongFull||candidateText(el);if(!full)return;
    el.dataset.mxLongState='expanded';el.classList.remove('mx-longtext-static-clamp');el.classList.remove('mx-longtext-collapsed');el.classList.add('mx-longtext-expanded');
    if(plainLeaf(el))el.textContent=full;
    const t=el.nextElementSibling;if(t?.classList?.contains('mx-longtext-toggle'))t.textContent='Ver menos';
  }
  function installToggle(el){
    if(el.nextElementSibling?.classList?.contains('mx-longtext-toggle'))return;
    const toggle=document.createElement('span');toggle.className='mx-longtext-toggle';toggle.setAttribute('role','button');toggle.setAttribute('tabindex','0');toggle.textContent='Ver más';
    const action=e=>{e.preventDefault();e.stopPropagation();el.dataset.mxLongState==='expanded'?collapse(el):expand(el)};
    toggle.addEventListener('click',action);toggle.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){action(e)}});el.insertAdjacentElement('afterend',toggle);
  }
  function apply(el){
    if(!isLikelyProductElement(el))return;
    const text=candidateText(el),w=words(text);if(w.length<=MAX_WORDS)return;
    const clickable=el.closest('button,a,[role="button"]');
    if(!el.dataset.mxLongFull || (el.dataset.mxLongState!=='expanded' && text!==preview(el.dataset.mxLongFull))){el.dataset.mxLongFull=text}
    el.title=el.dataset.mxLongFull;
    if(clickable){removeOldToggle(el);el.classList.add('mx-longtext-static-clamp');return}
    installToggle(el);if(el.dataset.mxLongState==='expanded'){el.classList.remove('mx-longtext-static-clamp');el.classList.add('mx-longtext-expanded');return}collapse(el);
  }
  function scan(root=document){
    try{if(root.nodeType===1&&isLikelyProductElement(root))apply(root)}catch(_e){}
    let nodes=[];try{nodes=[...root.querySelectorAll(selector+',td,option')]}catch(_e){}
    for(const el of nodes)apply(el);
  }
  let scheduled=false;function schedule(root=document){if(scheduled)return;scheduled=true;(window.requestAnimationFrame||setTimeout)(()=>{scheduled=false;scan(root)},0)}
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',()=>scan(document),{once:true});else scan(document);
  const mo=new MutationObserver(muts=>{for(const m of muts){if(m.type==='characterData'){schedule(m.target.parentElement||document);continue}for(const n of m.addedNodes){if(n.nodeType===1)schedule(n.parentElement||n)}}});
  try{mo.observe(document.documentElement,{subtree:true,childList:true,characterData:true})}catch(_e){}
  window.mxRefreshLongProductText=()=>scan(document);
})();

</script>


<script id="mx-activation-clean-v100-js">
(function(){'use strict';
 function clean(){
   const hint=document.getElementById('mxIdentityHint'); if(hint)hint.style.setProperty('display','none','important');
   for(const id of ['mxVaDevice','mxVaCopy','deviceIdBox','deviceBox','activationDevice','viewerDevice']){
     const e=document.getElementById(id); if(!e)continue; e.style.setProperty('display','none','important');
     const row=e.closest('.mx-va-idline,.field,.mx-login-row');
     if(row && /id[^<]{0,40}dispositivo|device\s*id/i.test(row.textContent||'')) row.style.setProperty('display','none','important');
   }
   document.querySelectorAll('.mx-login-row').forEach(row=>{if(/id[^<]{0,40}dispositivo/i.test(row.textContent||''))row.style.setProperty('display','none','important')});
   document.querySelectorAll('#mxViewerActivationGate label,#activationGate label,#mxVaGate label').forEach(l=>{
     if(/id[^<]{0,40}dispositivo|device\s*id/i.test(l.textContent||'')){const row=l.closest('.field,.mx-va-idline,.mx-login-row');if(row)row.style.setProperty('display','none','important')}
   });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',clean,{once:true});else clean();
 new MutationObserver(clean).observe(document.documentElement,{subtree:true,childList:true});
})();
