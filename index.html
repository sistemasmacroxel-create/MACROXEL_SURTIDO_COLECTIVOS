<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>MACROXEL Surtido Colectivos v1.0.0</title>
<style>
:root{--navy:#0b365f;--blue:#0f5c9b;--line:#dbe5f1;--muted:#64748b;--ok:#15803d;--bad:#b91c1c;--warn:#b45309}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:#f3f7fb;color:#10243a}.hidden{display:none!important}.app{max-width:1080px;margin:auto;padding:10px 10px 80px}.top{position:sticky;top:0;z-index:20;background:rgba(243,247,251,.96);backdrop-filter:blur(10px);padding:8px 0}.head{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border-radius:18px;padding:10px 12px;box-shadow:0 10px 25px rgba(10,52,93,.18)}.brand{display:flex;align-items:center;gap:9px;min-width:0}.brand img{width:42px;height:42px;object-fit:contain;border-radius:10px;background:#fff}.brand h1{font-size:16px;margin:0}.brand small{display:block;opacity:.82;font-size:10px}.session{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}.dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;box-shadow:0 0 0 4px rgba(255,255,255,.16)}.dot.ok{background:#22c55e}.dot.bad{background:#ef4444}.user{font-size:10px;font-weight:800}.btn{border:0;border-radius:11px;padding:9px 12px;font-weight:800;cursor:pointer;background:#e7eef7;color:#173a5b}.btn.ok{background:#15803d;color:#fff}.btn.bad{background:#b91c1c;color:#fff}.btn.secondary{background:#fff;color:#153b60;border:1px solid var(--line)}.btn:disabled{opacity:.55;cursor:not-allowed}.conn{font-size:8px;line-height:1.25;color:#475569;margin:5px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.toolbar{display:grid;grid-template-columns:1fr auto;gap:8px;margin:8px 0}.input,.select{width:100%;border:1px solid #cbd5e1;border-radius:12px;padding:11px 12px;background:#fff;color:#10243a;font-size:14px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:8px 0}.kpi{background:#fff;border:1px solid var(--line);border-radius:13px;padding:9px;text-align:center}.kpi small{display:block;color:var(--muted);font-size:9px;font-weight:800}.kpi b{font-size:19px;color:var(--navy)}.status{padding:8px 10px;border:1px solid var(--line);border-radius:11px;background:#fff;font-size:11px;color:#475569;margin-bottom:8px}.orders{display:grid;gap:9px}.order{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 16px rgba(15,39,69,.05)}.order[open]{border-color:#8fb8dc}.order summary{list-style:none;cursor:pointer;padding:12px}.order summary::-webkit-details-marker{display:none}.order-head{display:grid;grid-template-columns:1fr auto;gap:8px}.folio{font-size:16px;font-weight:950;color:var(--navy)}.meta{font-size:11px;color:#475569;margin-top:4px;line-height:1.4}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:900;align-self:start}.badge.pending{background:#eff6ff;color:#1d4ed8}.badge.claimed{background:#fff7ed;color:#c2410c}.badge.submitted{background:#fef9c3;color:#854d0e}.badge.applied{background:#dcfce7;color:#166534}.badge.error{background:#fee2e2;color:#b91c1c}.body{border-top:1px solid var(--line);padding:10px}.patient{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;background:#f8fafc;border-radius:12px;padding:9px;margin-bottom:9px}.patient div{font-size:10px}.patient b{display:block;font-size:12px;color:#173a5b}.item{border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0}.item-title{font-weight:900;color:#143f67;font-size:13px}.item-sub{font-size:10px;color:#64748b;margin-top:3px}.coverage{font-size:10px;font-weight:900;padding:6px 8px;border-radius:9px;margin-top:7px}.coverage.ok{background:#dcfce7;color:#166534}.coverage.warn{background:#ffedd5;color:#9a3412}.coverage.bad{background:#fee2e2;color:#b91c1c}.item-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:8px}.field label{display:block;font-size:9px;font-weight:900;color:#475569;margin:0 0 3px}.field .input,.field .select{padding:9px;font-size:13px}.field.full{grid-column:1/-1}.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:10px}.empty{padding:35px 10px;text-align:center;color:#64748b;background:#fff;border:1px solid var(--line);border-radius:15px}.overlay{position:fixed;inset:0;background:rgba(15,23,42,.52);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px}.gate{width:min(440px,100%);background:#fff;border-radius:20px;padding:17px;box-shadow:0 24px 60px rgba(0,0,0,.25)}.gate-brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}.gate-brand img{width:55px;height:55px;object-fit:contain}.gate h2{margin:0;color:var(--navy);font-size:19px}.gate p{font-size:12px;color:#64748b;line-height:1.45}.gate .field{margin:8px 0}.gate-msg{font-size:11px;padding:8px 10px;border-radius:10px;background:#f1f5f9;margin:8px 0}.gate-msg.bad{background:#fee2e2;color:#991b1b}.gate-msg.ok{background:#dcfce7;color:#166534}.spin{display:inline-block;width:15px;height:15px;border:2px solid #cbd5e1;border-top-color:#2563eb;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}@media(max-width:680px){.app{padding:6px 6px 75px}.head{border-radius:14px}.brand h1{font-size:14px}.brand small{display:none}.kpis{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.item-grid{grid-template-columns:1fr 1fr}.patient{grid-template-columns:1fr}.actions .btn{flex:1 1 145px}.conn{font-size:7px}}
</style></head><body>
<div class="app"><div class="top"><div class="head"><div class="brand"><img src="img/logo.png" alt="Macroxel"><div><h1>MACROXEL Surtido Colectivos</h1><small>Pedidos de servicios · v1.0.0</small></div></div><div class="session"><span id="connDot" class="dot"></span><span id="sessionUser" class="user"></span><button id="logout" class="btn secondary hidden" hidden style="display:none!important" type="button">Salir</button></div></div><div id="connInfo" class="conn"></div></div>
<div class="kpis"><div class="kpi"><small>Disponibles</small><b id="kPending">0</b></div><div class="kpi"><small>En surtido</small><b id="kClaimed">0</b></div><div class="kpi"><small>Por aplicar</small><b id="kApply">0</b></div><div class="kpi"><small>Aplicados hoy</small><b id="kDone">0</b></div></div>
<div class="toolbar"><input id="search" class="input" placeholder="Buscar folio, servicio, paciente o medicamento"><button id="reload" class="btn secondary" type="button">🔄 Actualizar</button></div><div id="status" class="status">Validando este dispositivo...</div><div id="orders" class="orders"></div></div>
<div id="activationGate" class="overlay"><div class="gate"><div class="gate-brand"><img src="img/logo.png"><div><h2>Activación del visor</h2><p>Solicita autorización para este dispositivo.</p></div></div><div id="activationConnection" class="gate-msg"></div><div class="field"><label>NOMBRE</label><input id="actName" class="input" autocomplete="name"></div><div class="field"><label>TELÉFONO</label><input id="actPhone" class="input" inputmode="tel"></div><div class="field"><label>CORREO</label><input id="actEmail" class="input" type="email"></div><div id="actMsg" class="gate-msg">Comprobando licencia...</div><div class="actions"><button id="actValidate" class="btn secondary" type="button">Validar</button><button id="actSubmit" class="btn ok" type="button">Solicitar activación</button></div></div></div>
<div id="loginGate" class="hidden" hidden aria-hidden="true"><input id="loginUser"><input id="loginPass"><div id="loginMsg"></div><button id="loginBtn"></button><div id="loginConnection"></div></div>
<script>
(()=>{'use strict';
const VERSION='1.0.0',APP_CODE='surtido_colectivos',APP_NAME='MACROXEL Surtido Colectivos',DISCOVERY_DB='https://ecosistema-macroxel-default-rtdb.firebaseio.com',LEGACY='HGAM',CFG_KEY='mx_sc_cfg_v1',DEVICE_KEY='mx_sc_device_v1',SESSION_KEY='mx_sc_device_identity_session_v2',IDENTITY_KEY='mx_sc_activation_identity_v2',ROOT='/service_orders',FUL='/service_order_fulfillments',CLAIM='/service_order_claims';
const $=id=>document.getElementById(id),txt=v=>String(v==null?'':v).trim(),norm=v=>txt(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' '),num=v=>{const n=Number(v);return Number.isFinite(n)?n:0},esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cfg=readCfg(),session=readSession(),orders=[],fulfillments={},claims={},stocks={},activeOrderId='';
function cleanDb(v){return txt(v).replace(/\.json\/?$/i,'').replace(/\/+$/,'')||DISCOVERY_DB}function cleanId(v){return(txt(v)||LEGACY).toUpperCase().replace(/[.#$\[\]\/]/g,'_')||LEGACY}function readCfg(){try{const r=JSON.parse(localStorage.getItem(CFG_KEY)||'null')||{};return{db:cleanDb(r.db),branch:cleanId(r.branch)}}catch(_e){return{db:DISCOVERY_DB,branch:LEGACY}}}function saveCfg(next){cfg={db:cleanDb(next.db),branch:cleanId(next.branch)};localStorage.setItem(CFG_KEY,JSON.stringify(cfg));renderConnection();return cfg}
function rest(path,bust=false){const p=String(path).startsWith('/')?String(path):'/'+String(path),u=new URL(cfg.db+p+(p.endsWith('.json')?'':'.json'));if(bust)u.searchParams.set('ts',Date.now());return u.toString()}async function get(path){const r=await fetch(rest(path,true),{cache:'no-store'});if(!r.ok)throw new Error('Firebase HTTP '+r.status);return r.json().catch(()=>null)}async function put(path,data){const r=await fetch(rest(path),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw new Error('Firebase HTTP '+r.status);return r.json().catch(()=>true)}
function keyOf(v){try{return btoa(unescape(encodeURIComponent(norm(v)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}catch(_e){return norm(v).replace(/[.#$\[\]\/]/g,'_')}}function deviceId(){let id=localStorage.getItem(DEVICE_KEY);if(!id){id='SC-'+(typeof crypto.randomUUID==='function'?crypto.randomUUID():(Date.now()+'-'+Math.random().toString(36).slice(2)));localStorage.setItem(DEVICE_KEY,id)}return id}
function identity(rec){return{fullName:txt(rec?.fullName||rec?.name||rec?.nombre),phone:txt(rec?.phone||rec?.telefono),email:txt(rec?.email||rec?.correo).toLowerCase()}}
function readIdentity(){try{const r=JSON.parse(localStorage.getItem(IDENTITY_KEY)||'null');return r&&r.fullName?r:null}catch(_e){return null}}
function saveIdentity(rec){const p=identity(rec);localStorage.setItem(IDENTITY_KEY,JSON.stringify(p));return p}
function matches(rec,p=readIdentity()){if(!rec||!p)return false;const a=identity(rec),b=identity(p);return norm(a.fullName)===norm(b.fullName)&&a.phone.replace(/\D/g,'')===b.phone.replace(/\D/g,'')&&a.email===b.email}
function validatePerson(){const p=identity({fullName:$('actName').value,phone:$('actPhone').value,email:$('actEmail').value});if(p.fullName.split(/\s+/).filter(Boolean).length<2)throw new Error('Captura el nombre completo, incluyendo apellidos.');const digits=p.phone.replace(/\D/g,'');if(digits.length<10||digits.length>15)throw new Error('Captura un teléfono válido de 10 a 15 dígitos.');if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(p.email))throw new Error('Captura un correo electrónico válido.');return p}
function useLicenseIdentity(rec){const p=identity(rec);session={username:p.fullName,name:p.fullName,fullName:p.fullName,phone:p.phone,email:p.email,authenticatedAt:new Date().toISOString(),expiresAt:new Date(rec.expiresAt||rec.vence||Date.now()+86400000).getTime(),deviceId:deviceId()};localStorage.setItem(SESSION_KEY,JSON.stringify(session));return session}async function digest(v){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(v)));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function renderConnection(){const s=`ID unidad: ${cfg.branch} · Firebase: ${cfg.db}`;$('connInfo').textContent=s;$('activationConnection').textContent=s;if($('loginConnection'))$('loginConnection').textContent=s}function setConn(ok){$('connDot').className='dot '+(ok===true?'ok':ok===false?'bad':'')}
async function discover(){try{const dbs=[...new Set([cfg.db,DISCOVERY_DB])],ids=[...new Set([cfg.branch,LEGACY])],list=[];for(const db of dbs){const old=cfg;cfg={...cfg,db};const latest=await get('/ecosystem_connection/latest').catch(()=>null);if(latest)list.push(latest);for(const id of ids){const r=await get('/ecosystem_connection/'+encodeURIComponent(id)).catch(()=>null);if(r)list.push(r)}cfg=old}const valid=list.map(r=>({db:cleanDb(r.firebaseUrl||r.currentUrl||r.db||r.url),branch:cleanId(r.unitId||r.activationId||r.storeId||r.branch),ts:new Date(r.updatedAt||r.publishedAt||0).getTime()})).filter(x=>x.db).sort((a,b)=>b.ts-a.ts)[0];const changed=!!(valid&&(valid.db!==cfg.db||valid.branch!==cfg.branch));if(changed)saveCfg(valid);setConn(true);return changed}catch(_e){setConn(false);return false}}
function licensePath(){return`/viewer_licenses/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(keyOf(deviceId()))}`}function licenseValid(r){if(!r)return false;const s=norm(r.status||r.estado);if(r.active!==true&&!['ACTIVE','ACTIVA','ACTIVO','VIGENTE'].includes(s))return false;if(['SUSPENDED','SUSPENDIDA','REVOKED','REVOCADA','EXPIRED','VENCIDA'].includes(s))return false;const t=new Date(r.expiresAt||r.vence||0).getTime();return Number.isFinite(t)&&t>Date.now()}
async function checkLicense(){await discover();try{const r=await get(licensePath());if(licenseValid(r)){const typed=saveIdentity(validatePerson());if(!matches(r,typed)){window.__licensed=false;$('activationGate').classList.remove('hidden');$('actMsg').className='gate-msg bad';$('actMsg').textContent='Los datos no coinciden con la activación autorizada. Verifica nombre completo, teléfono y correo.';return false}window.__licensed=true;useLicenseIdentity(r);$('activationGate').classList.add('hidden');$('loginGate').classList.add('hidden');startApp();return true}window.__licensed=false;$('activationGate').classList.remove('hidden');$('loginGate').classList.add('hidden');const state=norm(r?.status||'');$('actMsg').textContent=state.includes('PEND')?'Solicitud en espera de activación.':'Este dispositivo todavía no está activo.';return false}catch(e){$('actMsg').className='gate-msg bad';$('actMsg').textContent=e.message||('No se pudo validar: '+e);setConn(false);return false}}
async function submitActivation(){const person=saveIdentity(validatePerson()),now=new Date().toISOString(),prev=await get(licensePath()).catch(()=>null),record={...(prev||{}),name:person.fullName,fullName:person.fullName,phone:person.phone,email:person.email,appCode:APP_CODE,appName:APP_NAME,application:APP_NAME,version:VERSION,deviceId:deviceId(),deviceKey:keyOf(deviceId()),branch:cfg.branch,status:'pending',active:false,requestedAt:prev?.requestedAt||now,lastRequestAt:now,updatedAt:now,userAgent:navigator.userAgent,platform:navigator.platform};await put(licensePath(),record);await put(`/viewer_license_history/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(keyOf(deviceId()))}/${Date.now()}`,{...record,action:'REQUESTED',createdAt:now});$('actMsg').className='gate-msg ok';$('actMsg').textContent='Solicitud enviada. Actívala y después valida con los mismos datos.'}
function readSession(){try{const s=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');return s&&s.expiresAt>Date.now()?s:null}catch(_e){return null}}function saveSession(s){session={...s};localStorage.setItem(SESSION_KEY,JSON.stringify(session));return session}function logout(){checkLicense()}
async function login(){return checkLicense()}
function requestQty(it){return Math.max(0,num(it?.cantidadSolicitadaAhora??it?.cantidadPorRecibir??it?.cantidadRecibidaSolicitada??it?.cantidad24Horas??it?.cantidadSolicitada??it?.pzs??it?.cantidad))}function treatmentTotal(it){return Math.max(0,num(it?.cantidadTratamientoTotal||it?.totalUnidadesTratamiento||it?.cantidadSolicitada))}function statusOf(o){const s=norm(o?.status||o?.estado||'pending');return['FINALIZED','FINALIZADO','APPLIED','SURTIDO'].includes(s)?'applied':['REJECTED','NO SURTIDO','CANCELLED','CANCELADO'].includes(s)?'rejected':'pending'}function activeClaim(c){return c&&new Date(c.expiresAt||0).getTime()>Date.now()}function rowState(id,o){const f=fulfillments[id],c=claims[id],fs=txt(f?.status).toLowerCase();if(['pending_apply','processing'].includes(fs))return'submitted';if(fs==='applied'||statusOf(o)==='applied')return'applied';if(fs==='error')return'error';if(activeClaim(c))return'claimed';return'pending'}
async function loadStocks(){const data=await get(`/inventory_cpm_totals/${encodeURIComponent(cfg.branch)}/items`).catch(()=>null);stocks={};for(const r of Object.values(data||{})){if(r?.c)stocks[norm(r.c)]=num(r.e)}}async function load(force=false){if(!session)return;if(activeOrderId&&!force)return;try{setConn(null);$('status').innerHTML='<span class="spin"></span> Consultando pedidos...';const b=encodeURIComponent(cfg.branch),[o,f,c]=await Promise.all([get(`${ROOT}/${b}`).catch(()=>null),get(`${FUL}/${b}`).catch(()=>null),get(`${CLAIM}/${b}`).catch(()=>null),loadStocks()]);fulfillments=f||{};claims=c||{};orders=Object.entries(o||{}).filter(([,r])=>r&&statusOf(r)==='pending').map(([id,r])=>({id,...r})).sort((a,b)=>String(a.createdAt||'').localeCompare(String(b.createdAt||'')));setConn(true);render();$('status').textContent=`${orders.length} pedido(s) pendientes. Abre una tarjeta para iniciar el surtido.`}catch(e){setConn(false);$('status').textContent='No se pudo actualizar: '+e.message}}
function coverage(stock,total){const remain=stock-total;if(stock<total)return{c:'bad',t:`No cubre tratamiento: faltan ${total-stock} pzs`};if(remain<=30)return{c:'warn',t:`Alcanza, pero quedarían ${remain} pzs (reserva mínima 30)`};return{c:'ok',t:`Cubre tratamiento y quedarían ${remain} pzs`}}
function render(){const q=norm($('search').value),list=orders.filter(o=>!q||norm([o.folioSolicitud,o.servicio,o.paciente,o.usuarioSolicita,...(o.items||[]).flatMap(i=>[i.clave,i.descripcion])].join(' ')).includes(q)),today=new Date().toISOString().slice(0,10);$('kPending').textContent=orders.filter(o=>rowState(o.id,o)==='pending').length;$('kClaimed').textContent=orders.filter(o=>rowState(o.id,o)==='claimed').length;$('kApply').textContent=orders.filter(o=>rowState(o.id,o)==='submitted').length;$('kDone').textContent=Object.values(fulfillments).filter(f=>txt(f.status).toLowerCase()==='applied'&&txt(f.appliedAt).slice(0,10)===today).length;$('orders').innerHTML=list.length?list.map(orderHtml).join(''):'<div class="empty">No hay pedidos pendientes.</div>';document.querySelectorAll('details.order').forEach(d=>d.addEventListener('toggle',()=>{if(d.open){activeOrderId=d.dataset.id;claim(d.dataset.id)}else if(activeOrderId===d.dataset.id){activeOrderId='';const c=claims[d.dataset.id];if(c&&norm(c.claimedBy)===norm(session.username))release(d.dataset.id).catch(()=>{})}}));document.querySelectorAll('[data-release]').forEach(b=>b.onclick=()=>release(b.dataset.release));document.querySelectorAll('[data-submit]').forEach(b=>b.onclick=()=>submit(b.dataset.submit).catch(e=>$('status').textContent='❌ '+(e?.message||e)));document.querySelectorAll('[data-decision]').forEach(s=>s.onchange=()=>{const inp=document.querySelector(`[data-actual="${s.dataset.decision}"]`);if(inp){inp.disabled=s.value==='NO_SURTIR';if(s.value==='NO_SURTIR')inp.value=0;else if(num(inp.value)<=0)inp.value=inp.dataset.default||1}})}
function orderHtml(o){const state=rowState(o.id,o),f=fulfillments[o.id],c=claims[o.id],labels={pending:'Disponible',claimed:'En surtido',submitted:'Pendiente de aplicar',applied:'Aplicado',error:'Error'},claimedBy=txt(c?.claimedByName||c?.claimedBy),mine=activeClaim(c)&&norm(c.claimedBy)===norm(session.username),blocked=activeClaim(c)&&!mine,submitted=state==='submitted',items=(o.items||[]).map((it,i)=>itemHtml(o,it,i,blocked||submitted)).join('');return`<details class="order" data-id="${esc(o.id)}"><summary><div class="order-head"><div><div class="folio">${esc(o.folioSolicitud||o.folio||o.id)}</div><div class="meta"><b>${esc(o.servicio||'Sin servicio')}</b> · ${esc(o.paciente||'Colectivo ordinario')}<br>${(o.items||[]).length} producto(s) · solicita ${esc(o.usuarioSolicita||o.solicitante||'—')}</div></div><span class="badge ${state}">${labels[state]||state}</span></div>${blocked?`<div class="meta">En surtido por <b>${esc(claimedBy)}</b></div>`:''}${state==='error'?`<div class="meta" style="color:#b91c1c">${esc(f?.errorMessage||'Error al aplicar')}</div>`:''}</summary><div class="body"><div class="patient"><div>FOLIO<b>${esc(o.folioSolicitud||o.folio||'—')}</b></div><div>SERVICIO<b>${esc(o.servicio||'—')}</b></div><div>PACIENTE<b>${esc(o.paciente||'—')}</b></div><div>EXPEDIENTE<b>${esc(o.expediente||'—')}</b></div><div>MÉDICO<b>${esc(o.medico||'—')}</b></div><div>ENFERMERA SOLICITA<b>${esc(o.usuarioSolicita||o.solicitante||'—')}</b></div></div>${items}<div class="actions"><button class="btn secondary" data-release="${esc(o.id)}" ${blocked||submitted?'disabled':''}>Liberar pedido</button><button class="btn ok" data-submit="${esc(o.id)}" ${blocked||submitted?'disabled':''}>✅ Finalizar surtido</button></div>${submitted?'<div class="status">Ya se envió al sistema principal. En cuanto Macroxel Hospitales lo aplique, quedará registrado en Salidas.</div>':''}</div></details>`}
function itemHtml(o,it,i,disabled){const requested=requestQty(it),total=treatmentTotal(it),prior=num(it.cantidadRecibidaAcumuladaAnterior),remaining=total>0?Math.max(0,total-prior):requested,stock=num(stocks[norm(it.clave)]),cov=coverage(stock,total||requested),just=norm(o.tipo).includes('JUSTIFICADO'),key=`${o.id}:${i}`;return`<div class="item"><div class="item-title">${esc(it.clave)} — ${esc(it.descripcion||'')}</div><div class="item-sub">Solicitado ahora: <b>${requested}</b> · Total tratamiento: <b>${total||'—'}</b> · Restante: <b>${remaining||'—'}</b> · Existencia: <b>${stock}</b></div><div class="coverage ${cov.c}">${cov.t}</div><div class="item-grid"><div class="field"><label>DECISIÓN</label><select class="select" data-decision="${esc(key)}" ${disabled?'disabled':''}><option value="SURTIR">Surtir</option><option value="NO_SURTIR">No surtir</option></select></div>${just?`<div class="field"><label>CANTIDAD AUTORIZADA TOTAL</label><input class="input" data-authorized="${esc(key)}" type="number" min="0" step="1" value="${total||requested}" ${disabled?'disabled':''}></div>`:''}<div class="field"><label>PIEZAS QUE SURTE AHORA</label><input class="input" data-actual="${esc(key)}" data-default="${requested}" type="number" min="0" step="1" value="${requested}" ${disabled?'disabled':''}></div><div class="field full"><label>OBSERVACIÓN</label><input class="input" data-observation="${esc(key)}" value="${esc(it.observaciones||o.observaciones||'')}" ${disabled?'disabled':''}></div></div></div>`}
async function atomicClaim(id){const url=rest(`${CLAIM}/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(id)}`);for(let n=0;n<6;n++){const r=await fetch(url+'?ts='+Date.now(),{cache:'no-store',headers:{'X-Firebase-ETag':'true'}});if(!r.ok)throw new Error('No se pudo consultar el bloqueo.');const etag=r.headers.get('ETag')||'null_etag',old=await r.json().catch(()=>null),valid=activeClaim(old);if(valid&&norm(old.claimedBy)!==norm(session.username))return old;const now=Date.now(),next={orderId:id,claimedBy:session.username,claimedByName:session.name,deviceId:deviceId(),claimedAt:new Date(now).toISOString(),expiresAt:new Date(now+12*60000).toISOString()};const w=await fetch(url,{method:'PUT',headers:{'Content-Type':'application/json','if-match':etag},body:JSON.stringify(next)});if(w.status===412)continue;if(!w.ok)throw new Error('No se pudo reservar el pedido.');return next}throw new Error('Otro usuario tomó el pedido.')}
async function claim(id){const o=orders.find(x=>x.id===id);if(!o||['submitted','applied'].includes(rowState(id,o)))return;try{const c=await atomicClaim(id);claims[id]=c;if(norm(c.claimedBy)!==norm(session.username))$('status').textContent=`Pedido en surtido por ${c.claimedByName||c.claimedBy}.`;render();setTimeout(()=>{const d=document.querySelector(`details.order[data-id="${CSS.escape(id)}"]`);if(d)d.open=true},0)}catch(e){$('status').textContent=e.message}}
async function release(id){if(activeOrderId===id)activeOrderId='';const c=claims[id];if(c&&norm(c.claimedBy)!==norm(session.username))return;await put(`${CLAIM}/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(id)}`,null);delete claims[id];render()}
async function submit(id){const o=orders.find(x=>x.id===id);if(!o)return;const c=claims[id];if(!activeClaim(c)||norm(c.claimedBy)!==norm(session.username))return $('status').textContent='Abre el pedido y espera a que quede reservado a tu nombre.';const items=(o.items||[]).map((it,i)=>{const key=`${id}:${i}`,decision=document.querySelector(`[data-decision="${CSS.escape(key)}"]`)?.value||'SURTIR',actual=Math.max(0,Math.floor(num(document.querySelector(`[data-actual="${CSS.escape(key)}"]`)?.value))),authorized=Math.max(0,Math.floor(num(document.querySelector(`[data-authorized="${CSS.escape(key)}"]`)?.value||treatmentTotal(it)||actual))),observation=txt(document.querySelector(`[data-observation="${CSS.escape(key)}"]`)?.value),stock=num(stocks[norm(it.clave)]);if(decision==='SURTIR'&&actual>stock)throw new Error(`${it.clave}: la cantidad ${actual} supera la existencia publicada ${stock}.`);return{itemIndex:i,clave:it.clave,descripcion:it.descripcion,decision,actualQty:decision==='NO_SURTIR'?0:actual,authorizedTotal:authorized,requestedQty:requestQty(it),observation}});if(!confirm(`¿Finalizar el surtido ${o.folioSolicitud||o.folio||''}?\n\nSe registrará en Salidas la cantidad capturada por ${session.name}.`))return;const now=new Date().toISOString(),record={id,orderId:id,folioSolicitud:o.folioSolicitud||o.folio,status:'pending_apply',submittedAt:now,updatedAt:now,surtidoBy:session.username,surtidoByName:session.name,deviceId:deviceId(),branch:cfg.branch,service:o.servicio,patient:o.paciente,items,totalSurtidoCapturado:items.reduce((s,x)=>s+num(x.actualQty),0),source:'MACROXEL_SURTIDO_COLECTIVOS'};await put(`${FUL}/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(id)}`,record);const current=await get(`${ROOT}/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(id)}`).catch(()=>o);await put(`${ROOT}/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(id)}`,{...current,mobileStatus:'pending_apply',mobileSubmittedAt:now,mobileSubmittedBy:session.name,updatedAt:now});activeOrderId='';await release(id);fulfillments[id]=record;$('status').textContent='Surtido enviado. Esperando que el sistema principal lo registre en Salidas...';render();for(let n=0;n<30;n++){await new Promise(r=>setTimeout(r,1000));const f=await get(`${FUL}/${encodeURIComponent(cfg.branch)}/${encodeURIComponent(id)}`).catch(()=>null);if(f?.status==='applied'){$('status').textContent=`✅ Surtido registrado en Salidas. Folio ${f.folioFinal||o.folioSolicitud||''}.`;await load();return}if(f?.status==='error'){$('status').textContent='❌ No se pudo aplicar: '+(f.errorMessage||'Error desconocido');fulfillments[id]=f;render();return}}$('status').textContent='El surtido quedó pendiente de aplicar. Se completará cuando Macroxel Hospitales esté conectado.'}
